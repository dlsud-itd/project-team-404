name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run
        env:
          NG_APP_API_BASE_URL: http://localhost:3000
          NG_APP_SUPABASE_URL: https://placeholder.supabase.co
          NG_APP_SUPABASE_ANON_KEY: placeholder-anon-key

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ..
      - name: Start local Supabase
        run: npm --prefix .. run supabase:local:start
      - name: Reset local database without demo data
        run: npm --prefix .. run supabase:local:reset
      - name: Configure local integration test values
        shell: bash
        run: |
          status="$(../node_modules/.bin/supabase status -o env)"
          api_url="$(printf '%s\n' "$status" | sed -n 's/^API_URL=//p' | tr -d '"')"
          db_url="$(printf '%s\n' "$status" | sed -n 's/^DB_URL=//p' | tr -d '"')"
          service_role_key="$(printf '%s\n' "$status" | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')"
          : "${api_url:?Supabase status did not provide API_URL}"
          : "${db_url:?Supabase status did not provide DB_URL}"
          : "${service_role_key:?Supabase status did not provide SERVICE_ROLE_KEY}"
          echo "::add-mask::$service_role_key"
          {
            printf 'SUPABASE_TEST_URL=%s\n' "$api_url"
            printf 'SUPABASE_TEST_SERVICE_ROLE_KEY=%s\n' "$service_role_key"
            printf 'SUPABASE_TEST_DATABASE_URL=%s\n' "$db_url"
            printf 'SUPABASE_TEST_DIRECT_URL=%s\n' "$db_url"
          } >> "$GITHUB_ENV"
      - run: npm test
        env:
          NODE_ENV: test
          CORS_ALLOWED_ORIGINS: http://localhost:4200
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres

  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NG_APP_API_BASE_URL: http://localhost:3000
          NG_APP_SUPABASE_URL: https://placeholder.supabase.co
          NG_APP_SUPABASE_ANON_KEY: placeholder-anon-key

  build-backend:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
