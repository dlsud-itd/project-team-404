name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create tag and release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const pr = context.payload.pull_request;
            const tag = `v${pkg.version}-pr-${pr.number}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetSha = pr.merge_commit_sha;

            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: targetSha,
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }

              core.info(`Tag ${tag} already exists; continuing with release creation.`);
            }

            try {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: targetSha,
                name: `Release ${tag}`,
                body: [
                  `Automated release for PR #${pr.number}: ${pr.title}`,
                  '',
                  `Merged by: @${pr.merged_by?.login ?? 'unknown'}`,
                ].join('\n'),
                generate_release_notes: true,
              });
            } catch (error) {
              if (error.status === 422) {
                core.info(`Release ${tag} already exists; nothing to do.`);
                return;
              }

              throw error;
            }
