@if (saved(); as message) {
  <p class="form-notice" role="status">{{ message }}</p>
}
@if (formError(); as message) {
  <p class="form-error" role="alert">{{ message }}</p>
}

<form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <!-- Lets password managers match the change to the right account. -->
  <input
    type="text"
    class="visually-hidden"
    autocomplete="username"
    [value]="session.currentUser()?.username ?? ''"
    readonly
    tabindex="-1"
    aria-hidden="true"
  />

  <div class="field">
    <label for="current-password">Current password</label>
    <div class="password">
      <input
        id="current-password"
        [type]="visible().currentPassword ? 'text' : 'password'"
        formControlName="currentPassword"
        autocomplete="current-password"
        [attr.aria-invalid]="!!fieldError('currentPassword')"
        aria-describedby="current-password-status"
        (input)="clearServerError('currentPassword')"
      />
      <button
        type="button"
        class="toggle"
        [attr.aria-pressed]="visible().currentPassword"
        (click)="toggle('currentPassword')"
      >
        {{ visible().currentPassword ? 'Hide' : 'Show' }}
        <span class="visually-hidden">current password</span>
      </button>
    </div>
    <p id="current-password-status" class="field-message" aria-live="polite">
      {{ fieldError('currentPassword') }}
    </p>
  </div>

  <div class="field">
    <label for="new-password">New password</label>
    <div class="password">
      <input
        id="new-password"
        [type]="visible().newPassword ? 'text' : 'password'"
        formControlName="newPassword"
        autocomplete="new-password"
        [placeholder]="'At least ' + minLength + ' characters'"
        [attr.aria-invalid]="!!fieldError('newPassword')"
        aria-describedby="new-password-status"
        (input)="clearServerError('newPassword')"
      />
      <button
        type="button"
        class="toggle"
        [attr.aria-pressed]="visible().newPassword"
        (click)="toggle('newPassword')"
      >
        {{ visible().newPassword ? 'Hide' : 'Show' }}
        <span class="visually-hidden">new password</span>
      </button>
    </div>
    <p id="new-password-status" class="field-message" aria-live="polite">
      {{ fieldError('newPassword') }}
    </p>
  </div>

  <div class="field">
    <label for="confirm-password">Confirm new password</label>
    <div class="password">
      <input
        id="confirm-password"
        [type]="visible().confirmPassword ? 'text' : 'password'"
        formControlName="confirmPassword"
        autocomplete="new-password"
        [attr.aria-invalid]="!!fieldError('confirmPassword')"
        aria-describedby="confirm-password-status"
        (input)="clearServerError('confirmPassword')"
      />
      <button
        type="button"
        class="toggle"
        [attr.aria-pressed]="visible().confirmPassword"
        (click)="toggle('confirmPassword')"
      >
        {{ visible().confirmPassword ? 'Hide' : 'Show' }}
        <span class="visually-hidden">confirmed password</span>
      </button>
    </div>
    <p id="confirm-password-status" class="field-message" aria-live="polite">
      {{ fieldError('confirmPassword') }}
    </p>
  </div>

  <div class="actions">
    <button type="submit" class="primary" [disabled]="submitting() || form.invalid">
      {{ submitting() ? 'Changing…' : 'Change password' }}
    </button>
  </div>
</form>
