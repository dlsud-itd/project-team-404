<div class="landing">
  <header class="topbar">
    <a class="brand" routerLink="/">HabitFlow</a>

    <nav class="nav" aria-label="Main">
      @for (link of navLinks; track link.fragment) {
        <a routerLink="/" [fragment]="link.fragment">{{ link.label }}</a>
      }
    </nav>

    <div class="actions">
      <app-theme-switcher />
      <a class="login" routerLink="/login">Log in</a>
      <a class="cta cta--small" routerLink="/register">Get started</a>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-heading">
      <div class="hero-copy">
        <h1 id="hero-heading" class="headline">Plan the week, keep the streak</h1>
        <p class="subhead">Projects, dates, priorities and recurring tasks in one planner</p>

        <div class="hero-actions">
          <a class="cta cta--large" routerLink="/register">Create free account</a>
          <a class="secondary" routerLink="/" fragment="how-it-works">How it works</a>
        </div>
      </div>

      <!-- A static picture of the Today list, drawn from the app's own pieces. -->
      <figure class="hero-art">
        <div
          class="hero-board"
          role="img"
          aria-label="A preview of today's tasks: two done, one due today, one weekly, and a 12-day streak"
        >
          <div class="board-head">
            <p class="board-title">Today</p>
            <p class="board-date">Thursday, Mar 12</p>
          </div>

          <ul class="board-tasks">
            @for (task of previewTasks; track task.title) {
              <li
                class="board-task"
                [class.is-done]="task.done"
                [style.--priority-color]="'var(--priority-' + task.priority + '-accent)'"
              >
                <span class="board-check">
                  @if (task.done) {
                    <svg aria-hidden="true" viewBox="0 0 16 16">
                      <path d="m4 8.5 2.5 2.5L12 5.5" />
                    </svg>
                  }
                </span>
                <span class="board-text">
                  <span class="board-name">{{ task.title }}</span>
                  <span class="board-meta">{{ task.meta }}</span>
                </span>
                @if (task.streak) {
                  <span class="board-streak">
                    <svg aria-hidden="true" class="flame" viewBox="0 0 24 24">
                      <path
                        d="M12 2c1 3.6-1.6 5.2-1.6 7.7 0 1.4 1 2.5 2.4 2.5 1.6 0 2.7-1.4 2.3-3.5 2.4 1.7 3.9 4.3 3.9 6.8 0 3.6-3.1 6.5-7 6.5s-7-2.9-7-6.5C5 10 10.5 7.6 12 2z"
                      />
                    </svg>
                    {{ task.streak }}
                  </span>
                } @else if (task.due) {
                  <span class="board-due">{{ task.due }}</span>
                }
              </li>
            }
          </ul>

          <div class="board-week">
            <ol class="week">
              @for (day of previewWeek; track $index) {
                <li class="week-day" [attr.data-state]="day.state">
                  <span class="week-label">{{ day.label }}</span>
                  <span class="week-box"></span>
                </li>
              }
            </ol>
            <p class="week-streak">
              <svg aria-hidden="true" class="flame" viewBox="0 0 24 24">
                <path
                  d="M12 2c1 3.6-1.6 5.2-1.6 7.7 0 1.4 1 2.5 2.4 2.5 1.6 0 2.7-1.4 2.3-3.5 2.4 1.7 3.9 4.3 3.9 6.8 0 3.6-3.1 6.5-7 6.5s-7-2.9-7-6.5C5 10 10.5 7.6 12 2z"
                />
              </svg>
              <span><b>12</b> day streak</span>
            </p>
          </div>
        </div>
      </figure>
    </section>

    <hr class="divider" />

    <app-landing-features id="features" />
  </main>

  <app-landing-steps id="how-it-works" />
  <app-landing-closing />
  <app-landing-footer id="about" />
</div>
