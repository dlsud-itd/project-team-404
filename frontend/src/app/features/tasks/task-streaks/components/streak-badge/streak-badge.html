@if (streak(); as streak) {
  <span
    class="badge"
    [class.at-risk]="streak.atRisk"
    [class.cold]="streak.currentStreak === 0"
    tabindex="0"
    cdkOverlayOrigin
    #origin="cdkOverlayOrigin"
    [attr.aria-label]="label()"
    [attr.aria-describedby]="tooltipId"
    (mouseenter)="tooltipOpen.set(true)"
    (mouseleave)="tooltipOpen.set(false)"
    (focus)="tooltipOpen.set(true)"
    (blur)="tooltipOpen.set(false)"
    (keydown.escape)="tooltipOpen.set(false)"
  >
    <svg class="flame" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        d="M12 2c1 3.6-1.6 5.2-1.6 7.7 0 1.4 1 2.5 2.4 2.5 1.6 0 2.7-1.4 2.3-3.5 2.4 1.7 3.9 4.3 3.9 6.8 0 3.6-3.1 6.5-7 6.5s-7-2.9-7-6.5C5 10 10.5 7.6 12 2z"
      />
    </svg>
    <span class="count">{{ countLabel() }}</span>
    <!-- Always in the page for screen readers; the overlay below is the visible copy. -->
    <span class="visually-hidden" [id]="tooltipId">{{ details().join('. ') }}.</span>
  </span>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="tooltipOpen()"
    [cdkConnectedOverlayPositions]="positions"
    [cdkConnectedOverlayPush]="true"
    [cdkConnectedOverlayViewportMargin]="8"
  >
    <span class="tooltip" aria-hidden="true">
      @for (line of details(); track line) {
        <span class="line" [class.risk]="$last && streak.atRisk">{{ line }}</span>
      }
    </span>
  </ng-template>
}
