<div class="sort" role="group" [attr.aria-label]="label()">
  <button type="button" class="trigger" [cdkMenuTriggerFor]="menu">
    <span class="muted">Sort:</span> {{ current().label }}
    <svg class="caret" viewBox="0 0 12 12" aria-hidden="true">
      <path d="M3 4.5 6 7.5 9 4.5" />
    </svg>
  </button>

  @if (hasDirection()) {
    <button
      type="button"
      class="direction"
      aria-label="Descending order"
      [attr.aria-pressed]="direction() === 'desc'"
      [title]="direction() === 'desc' ? 'Descending' : 'Ascending'"
      (click)="flip()"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true" [class.desc]="direction() === 'desc'">
        <path d="M8 13V3M4 7l4-4 4 4" />
      </svg>
    </button>
  }
</div>

<ng-template #menu>
  <div class="menu" cdkMenu [attr.aria-label]="label()">
    @for (option of options(); track option.value) {
      <button
        type="button"
        class="item"
        cdkMenuItemRadio
        [cdkMenuItemChecked]="option.value === current().value"
        (cdkMenuItemTriggered)="select(option.value)"
      >
        <svg class="check" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 8.5 6.5 11.5 12.5 4.5" />
        </svg>
        {{ option.label }}
      </button>
    }
  </div>
</ng-template>
