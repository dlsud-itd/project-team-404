<fieldset aria-describedby="task-recurrence-status">
  <legend>Repeat</legend>
  <div class="options">
    @for (option of options; track option.value) {
      <label class="option">
        <input
          type="radio"
          name="task-recurrence"
          [value]="option.value"
          [formControl]="control()"
          (change)="edited.emit()"
        />
        <span>{{ option.label }}</span>
      </label>
    }
  </div>
  @if (label(); as label) {
    <p class="summary">Repeats {{ label }}</p>
  }
  <p id="task-recurrence-status" class="field-message" aria-live="polite">{{ error() }}</p>
</fieldset>
